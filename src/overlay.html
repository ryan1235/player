<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Player overlay</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="ov-root" id="ov-root">
    <div class="ov-top" id="ov-top">
      <span id="now-playing-title" class="ov-title">Nada em reprodução</span>
      <span id="ov-cast-source" class="ov-cast-source" hidden></span>
      <span id="ov-quality-info" class="ov-quality-info" hidden></span>
      <span id="buffering-indicator" class="ov-buffering" hidden>Carregando…</span>
    </div>

    <div class="ov-bottom" id="ov-bottom">
      <div class="ov-progress" id="ov-progress">
        <div class="ov-progress-hit" id="ov-progress-hit">
          <div class="ov-progress-track">
            <div class="ov-progress-buffered" id="ov-progress-buffered"></div>
            <div class="ov-progress-played" id="ov-progress-played"></div>
            <div class="ov-progress-thumb" id="ov-progress-thumb"></div>
          </div>
        </div>
        <div class="ov-tooltip" id="ov-tooltip">0:00</div>
      </div>
      <div class="ov-spacer"></div>

      <div class="ov-row">
        <div class="ov-group ov-group-left">
          <button id="btn-back10" class="ov-btn" aria-label="Voltar 10 segundos" title="Voltar 10s (←)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M11 6 5 12l6 6M5 12h9a5 5 0 1 1 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-playpause" class="ov-btn ov-btn-accent ov-btn-lg" aria-label="Reproduzir ou pausar" title="Play/Pause (Espaço)">
            <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M8 5v14l11-7-11-7Z" fill="currentColor"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="none" hidden><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-fwd10" class="ov-btn" aria-label="Avançar 10 segundos" title="Avançar 10s (→)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M13 6l6 6-6 6M19 12h-9a5 5 0 1 0 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-stop" class="ov-btn ov-btn-quiet" aria-label="Parar" title="Parar">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
          </button>

          <div class="ov-volume" id="ov-volume">
            <button id="btn-mute" class="ov-btn" aria-label="Ativar ou desativar mudo" title="Mudo (M)">
              <svg id="icon-vol-on" viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M4 10v4h4l5 4V6L8 10H4Z" fill="currentColor"/><path d="M17 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <svg id="icon-vol-off" viewBox="0 0 24 24" width="17" height="17" fill="none" hidden><path d="M4 10v4h4l5 4V6L8 10H4Z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <div class="ov-volume-slider">
              <input id="volume" type="range" min="0" max="150" value="100" aria-label="Volume" />
            </div>
          </div>

          <div class="ov-time" id="ov-time">
            <span id="time-current">0:00</span><span class="ov-time-sep" id="ov-time-sep">/</span><span id="time-duration" class="ov-time-duration">0:00</span>
            <span id="ov-live-badge" class="ov-live-badge" hidden>AO VIVO</span>
            <button id="ov-live-dvr-btn" class="ov-live-dvr-btn ov-hidden">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
              <span>Voltar pro Ao Vivo</span>
            </button>
            <span id="ov-live-stats" class="ov-live-stats" hidden></span>
          </div>
        </div>

        <div class="ov-group ov-group-right">
          <div class="ov-cluster">
            <div class="ov-menu-wrap" id="ov-quality-container" style="display: none;">
              <button id="ov-btn-quality" class="ov-btn" aria-label="Qualidade de Vídeo" title="Qualidade de vídeo">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
              </button>
              <div class="ov-menu" id="ov-quality-menu" role="menu" aria-label="Qualidade"></div>
            </div>
          </div>

          <div class="ov-cluster ov-cluster-subs">
            <div class="ov-menu-wrap" id="ov-audio-wrap" hidden>
              <button id="btn-audio-menu" class="ov-btn" aria-label="Faixa de áudio" aria-haspopup="true" aria-expanded="false" title="Faixa de áudio">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="15" cy="16" r="3"/></svg>
              </button>
              <div class="ov-menu" id="ov-audio-menu" role="menu" aria-label="Áudio"></div>
            </div>
            <div class="ov-menu-wrap" id="ov-subtitle-wrap" hidden>
              <button id="btn-subtitle-menu" class="ov-btn" aria-label="Legendas" aria-haspopup="true" aria-expanded="false" title="Legendas">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 15v-2a2 2 0 0 1 2-2h1M14 15v-2a2 2 0 0 1 2-2h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </button>
              <div class="ov-menu" id="ov-subtitle-menu" role="menu" aria-label="Legendas"></div>
            </div>
          </div>

          <div class="ov-cluster" id="ov-speed-cluster" hidden>
            <div class="ov-menu-wrap" id="ov-speed-wrap">
              <button id="btn-speed" class="ov-btn ov-btn-text" aria-label="Velocidade de reprodução" aria-haspopup="true" aria-expanded="false" title="Velocidade de reprodução">1x</button>
              <div class="ov-menu" id="ov-speed-menu" role="menu" aria-label="Velocidade"></div>
            </div>
          </div>

          <div class="ov-cluster">
            <div class="ov-menu-wrap" id="ov-fit-wrap">
              <button id="btn-aspect" class="ov-btn" aria-label="Ajustar proporção do vídeo" aria-haspopup="true" aria-expanded="false" title="Ajustar proporção do vídeo">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="7" y="7" width="10" height="10" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
              </button>
              <div class="ov-menu" id="ov-fit-menu" role="menu" aria-label="Proporção do vídeo"></div>
            </div>
            <button id="btn-screenshot" class="ov-btn" aria-label="Capturar tela" title="Capturar tela">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.3"/></svg>
            </button>
            <div class="ov-menu-wrap" id="ov-more-wrap">
              <button id="btn-more" class="ov-btn" aria-label="Mais opções" aria-haspopup="true" aria-expanded="false" title="Mais opções">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
              </button>
              <div class="ov-menu ov-menu-actions" id="ov-more-menu" role="menu" aria-label="Mais opções"></div>
            </div>
            <button id="btn-fullscreen" class="ov-btn" aria-label="Alternar tela cheia" title="Tela cheia (F)">
              <svg id="icon-fs-enter" viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg id="icon-fs-exit" viewBox="0 0 24 24" width="17" height="17" fill="none" hidden><path d="M9 4v3a1 1 0 0 1-1 1H5M15 4v3a1 1 0 0 0 1 1h3M9 20v-3a1 1 0 0 0-1-1H5M15 20v-3a1 1 0 0 1 1-1h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="ov-debug" id="ov-debug" hidden>
      <div class="ov-debug-title">MPV DEBUG</div>
      <div class="ov-debug-row"><span>State</span><span id="dbg-state">—</span></div>
      <div class="ov-debug-row"><span>Mode</span><span id="dbg-mode">—</span></div>
      <div class="ov-debug-row"><span>Buffer</span><span id="dbg-buffer">—</span></div>
      <div class="ov-debug-row"><span>Latency</span><span id="dbg-latency">—</span></div>
      <div class="ov-debug-row"><span>Target Buffer</span><span id="dbg-target">—</span></div>
      <div class="ov-debug-row"><span>Health</span><span id="dbg-health">—</span></div>
      <div class="ov-debug-row"><span>Speed</span><span id="dbg-speed">—</span></div>
      <div class="ov-debug-row"><span>FPS</span><span id="dbg-fps">—</span></div>
      <div class="ov-debug-row"><span>Dropped Frames</span><span id="dbg-dropped">—</span></div>
      <div class="ov-debug-row"><span>Bitrate</span><span id="dbg-bitrate">—</span></div>
      <div class="ov-debug-row"><span>Download</span><span id="dbg-download">—</span></div>
      <div class="ov-debug-row"><span>DVR</span><span id="dbg-dvr">—</span></div>
      <div class="ov-debug-row"><span>Auto-Healing</span><span id="dbg-healing">—</span></div>
      <div class="ov-debug-row"><span>Reconnects</span><span id="dbg-reconnects">—</span></div>
    </div>
    <div class="ov-modal-backdrop" id="ov-modal-backdrop" hidden>
      <div class="ov-modal" id="ov-modal" role="dialog" aria-modal="true">
        <div class="ov-modal-header">
          <span id="ov-modal-title">—</span>
          <button id="ov-modal-close" class="ov-btn ov-btn-quiet" aria-label="Fechar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="ov-modal-body" id="ov-modal-body"></div>
      </div>
    </div>
  </div>
  <script src="overlay-renderer.js"></script>
</body>
</html>
